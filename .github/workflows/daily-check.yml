name: Daily electricity price check

on:
  schedule:
    - cron: "15 13 * * *"   # 13:15 UTC daily -> ~15:15 EET / 16:15 EEST, safely after Elering publishes
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run price check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_prices.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update electricity price report"
          git push
